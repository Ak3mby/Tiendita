    <h2 data-th-text="${producto.id != null} ? 'Editar Producto' : 'Crear Nuevo Producto'">Formulario de Producto</h2>
    <form data-th-action="@{/productos/guardar}" data-th-object="${producto}" method="post">
        
        <input type="hidden" data-th-field="*{id}" />
        <div>
            <label for="nombre">Nombre :</label>
            <input type="text" id="nombre" data-th-field="*{nombre}" required />
        </div>
        <br/>
        <div>
            <label for="categoria">Categoria :</label>
            <input type="text" id="categoria" data-th-field="*{categoria}" required />
        </div>
        <br/>
        <div>
            <label for="precio">Precio ($):</label>
            <input type="number" step="0.01" id="precio" data-th-field="*{precio}" required />
        </div>
        <br/>
        <div>
            <label for="cantidad">Cantidad :</label>
            <input type="number" id="cantidad" data-th-field="*{cantidad}" required />
        </div>
        <br/>
        <div>
            <label for="descripcion">Descripcion :</label>
            <input type="text" id="descripcion" data-th-field="*{descripcion}" required />
        </div>
        <br/>
        <button type="submit">Guardar Producto</button>
        <a data-th-href="@{/productos}">Cancelar</a>
    </form>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
